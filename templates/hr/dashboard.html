<!DOCTYPE html>
<html>
<head>
    <title>HR Dashboard</title>

    <style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

.sidebar{
width:250px;
height:100vh;
background:#2c3e50;
position:fixed;
}

.sidebar h2{
color:white;
text-align:center;
padding:20px;
}

.sidebar a{
display:block;
padding:15px;
color:white;
text-decoration:none;
}

.sidebar a:hover{
background:#34495e;
}

.content{
margin-left:250px;
padding:30px;
}

.card{
display:inline-block;
width:220px;
background:white;
padding:20px;
margin:15px;
border-radius:10px;
box-shadow:0 0 10px gray;
text-align:center;
}



.sidebar{
width:250px;
height:100vh;
position:fixed;
left:0;
top:0;
background:linear-gradient(180deg,#0F4C81,#1565C0);
color:white;
overflow:auto;
}

.logo{
padding:25px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.2);
}

.logo h2{
margin:0;
font-size:28px;
}

.logo p{
margin-top:5px;
font-size:14px;
opacity:.8;
}

.sidebar a{
display:block;
padding:15px 25px;
color:white;
text-decoration:none;
font-size:16px;
transition:.3s;
}

.sidebar a:hover{
background:rgba(255,255,255,.15);
padding-left:35px;
}

.main{
margin-left:250px;
padding:30px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>HR Panel</h2>

<a href="{{ url_for('hr_dashboard') }}">🏠 Dashboard</a>

<a href="{{ url_for('post_job') }}">➕ Post Job</a>

<a href="{{ url_for('manage_jobs') }}">📄 Manage Jobs</a>

<a href="{{ url_for('applicants') }}">👥 Applicants</a>

<a href="{{ url_for('shortlisted') }}">📨 Shortlisted</a>

<a href="{{ url_for('hr_settings') }}">⚙️ Settings</a>

<a href="{{ url_for('hr_profile') }}">
    👤 My Profile
</a>

<a href="{{ url_for('logout') }}">🚪 Logout</a>

</div>

<div class="content">

<h1>Welcome {{ hr.name }}</h1>

<div class="card">
<h2>{{ total_jobs }}</h2>
<p>Total Jobs</p>
</div>

<div class="card">
<h2>{{ total_applicants }}</h2>
<p>Applicants</p>
</div>

</div>

</body>
</html>
