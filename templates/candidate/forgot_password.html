<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - TalentBridge</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background: #f1f8f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .container {
        width: 420px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
    }

    h2 {
        text-align: center;
        color: #198754;
    }

    p {
        color: #666;
        text-align: center;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #198754;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #157347;
    }

    .reset-box {
        margin-top: 20px;
        padding: 15px;
        background: #e8f5e9;
        border-radius: 8px;
        word-break: break-all;
    }

    .reset-box a {
        color: #198754;
        font-weight: bold;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #198754;
        text-decoration: none;
    }

    .back:hover {
        color: #157347;
    }
</style>
</head>

<body>

<div class="container">

    <h2>Forgot Password?</h2>

    <p>
        Enter your registered email address to generate
        a password reset link.
    </p>

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Generate Reset Link
        </button>

    </form>

    {% if reset_link %}

    <div class="reset-box">

        <strong>Password Reset Link:</strong>

        <br><br>

        <a href="{{ reset_link }}">
            {{ reset_link }}
        </a>

        <p>
            This link is valid for 30 minutes.
        </p>

    </div>

    {% endif %}

    <a class="back"
       href="{{ url_for('candidate_login') }}">
        ← Back to Login
    </a>

</div>

</body>
</html>
