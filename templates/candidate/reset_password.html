<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - TalentBridge</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #6a0dad;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6a0dad;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #570b91;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <form method="POST">

        <input
            type="password"
            name="password"
            placeholder="Enter new password"
            minlength="6"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            minlength="6"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

</body>
</html>
