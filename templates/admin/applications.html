<!DOCTYPE html>
<html lang="en">

<head>

    <title>Applications - TalentBridge</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .main {
            margin-left: 260px;
            padding: 35px;
        }

        h1 {
            color: #0F4C81;
            margin-bottom: 25px;
        }

        .table-box {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0F4C81;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status {
            padding: 6px 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

    </style>

</head>

<body>

{% include "admin/sidebar.html" %}

<div class="main">

    <h1>📄 Applications</h1>

    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Candidate ID</th>
                    <th>Job ID</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody>

                {% for application in applications %}

                <tr>

                    <td>{{ application.id }}</td>

                    <td>{{ application.candidate_id }}</td>

                    <td>{{ application.job_id }}</td>

                    <td>
                        <span class="status">
                            {{ application.status }}
                        </span>
                    </td>

                </tr>

                {% else %}

                <tr>

                    <td colspan="4" class="empty">
                        No applications received yet.
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
