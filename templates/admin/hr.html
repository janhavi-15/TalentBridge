<!DOCTYPE html>
<html lang="en">

<head>

    <title>Manage HR - TalentBridge</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .main {
            margin-left: 260px;
            padding: 35px;
        }

        h1 {
            color: #0F4C81;
            margin-bottom: 25px;
        }

        .table-box {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0F4C81;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f8fafc;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

    </style>

</head>

<body>

{% include "admin/sidebar.html" %}

<div class="main">

    <h1>🏢 Manage HR</h1>

    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Company</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody>

                {% for hr in hr_users %}

                <tr>

                    <td>{{ hr.id }}</td>

                    <td>{{ hr.name }}</td>

                    <td>{{ hr.email }}</td>

                    <td>{{ hr.mobile }}</td>

                    <td>{{ hr.company }}</td>

                    <td>

                <form
                    method="POST"
                    action="{{ url_for('delete_hr', user_id=hr.id) }}"
                    onsubmit="return confirm('Deleting this HR will also delete all jobs posted by this HR. Continue?');"
                >

                    <button
                        type="submit"
                        class="delete-btn"
                    >
                        🗑️ Delete
                    </button>

                </form>

            </td>

                </tr>


                {% else %}

                <tr>

                    <td colspan="5" class="empty">
                        No HR users registered yet.
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
