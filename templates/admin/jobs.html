<!DOCTYPE html>
<html lang="en">

<head>

    <title>Manage Jobs - TalentBridge</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .main {
            margin-left: 260px;
            padding: 35px;
        }

        h1 {
            color: #0F4C81;
            margin-bottom: 25px;
        }

        .table-box {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0F4C81;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f8fafc;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

    </style>

</head>

<body>

{% include "admin/sidebar.html" %}

<div class="main">

    <h1>💼 Manage Jobs</h1>

    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Job Title</th>
                    <th>Company</th>
                    <th>Location</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody>

                {% for job in jobs %}

                <tr>

                    <td>{{ job.id }}</td>

                    <td>{{ job.title }}</td>

                    <td>{{ job.company }}</td>

                    <td>{{ job.location }}</td>

                    <td>{{ job.description }}</td>


                    <td>

                <form
    method="POST"
    action="{{ url_for('delete_job', job_id=job.id) }}"
    onsubmit="return confirm('Are you sure you want to delete this job?');"
    style="display:inline;"
>
    <button type="submit" class="delete-btn">
        🗑️ Delete
    </button>
</form>

            </td>

                </tr>

                {% else %}

                <tr>

                    <td colspan="5" class="empty">
                        No jobs posted yet.
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
