<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin OTP Verification</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .otp-container {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.12);

            text-align: center;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 10px;
            color: #222;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .otp-input {

            width: 100%;

            padding: 14px;

            font-size: 24px;

            text-align: center;

            letter-spacing: 8px;

            border: 1px solid #ccc;

            border-radius: 8px;

            outline: none;
        }

        .otp-input:focus {
            border-color: #27ae60;
        }

        button {

            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #27ae60;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #219150;
        }

        .message {

            margin-bottom: 15px;

            padding: 10px;

            background: #fff3cd;

            color: #856404;

            border-radius: 6px;

            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="otp-container">

        <div class="icon">
            🔐
        </div>

        <h2>Admin Verification</h2>

        <p>
            Enter the 6-digit OTP displayed in your terminal.
        </p>

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form method="POST">

            <input
                type="text"
                name="otp"
                class="otp-input"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                placeholder="000000"
                required
                autofocus
            >

            <button type="submit">
                Verify OTP
            </button>

        </form>

    </div>

</body>
</html>
