<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef2f7;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{

width:430px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.15);

}

h2{

text-align:center;
margin-bottom:25px;
color:#1d3557;

}

p{

text-align:center;
margin-bottom:25px;
color:#666;

}

input{

width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:20px;
font-size:15px;

}

button{

width:100%;
padding:14px;
background:#2eb15d;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#23944d;

}

.back{

text-align:center;
margin-top:18px;

}

.back a{

text-decoration:none;
color:#2eb15d;

}

</style>

</head>

<body>

<div class="container">

<h2>Forgot Password</h2>

<p>Enter your registered email address.</p>

<form method="POST">

    <input
        type="email"
        name="email"
        placeholder="Enter Registered Email"
        required>

    <button type="submit">
        Send OTP
    </button>

</form>

<div class="back">

<a href="/candidate/login">

Back to Login

</a>

</div>

</div>

</body>
</html>
