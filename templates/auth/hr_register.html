<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Registration</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body{
            margin:0;
            font-family:Poppins,sans-serif;
            background:#f4f6f9;
        }

        .container{
            width:500px;
            margin:40px auto;
            background:#fff;
            padding:35px;
            border-radius:10px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#2c3e50;
        }

        .input-box{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:500;
        }

        input,select,textarea{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        .btn{
            width:100%;
            padding:14px;
            background:#27ae60;
            color:#fff;
            border:none;
            border-radius:6px;
            font-size:17px;
            cursor:pointer;
        }

        .btn:hover{
            background:#1f8a4d;
        }

        .login{
            text-align:center;
            margin-top:20px;
        }

        .login a{
            text-decoration:none;
            color:#27ae60;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Company HR Registration</h2>

<form method="POST">

<div class="input-box">
<label>Company Name</label>
<input type="text" name="company_name" required>
</div>

<div class="input-box">
<label>HR Name</label>
<input type="text" name="hr_name" required>
</div>

<div class="input-box">
<label>Company Email</label>
<input type="email" name="email" required>
</div>

<div class="input-box">
<label>Mobile Number</label>
<input type="text" name="mobile" required>
</div>

<div class="input-box">
<label>Company Website</label>
<input type="url" name="website">
</div>

<div class="input-box">
<label>Industry</label>
<select name="industry">
<option>IT</option>
<option>Finance</option>
<option>Healthcare</option>
<option>Education</option>
<option>Manufacturing</option>
<option>Marketing</option>
<option>Other</option>
</select>
</div>

<div class="input-box">
<label>Company Address</label>
<textarea name="address" rows="3"></textarea>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" name="password" required>
</div>

<div class="input-box">
<label>Confirm Password</label>
<input type="password" name="confirm_password" required>
</div>

<button class="btn">Register Company</button>

<div class="login">
Already Registered?
<a href="{{ url_for('hr_login') }}">Login</a>
</div>

</form>

</div>

</body>
</html>
